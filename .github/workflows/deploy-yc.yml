name: Deploy → YC Serverless Container

on:
  push:
    branches: [main]

env:
  IMAGE: cr.yandex/${{ secrets.YC_REGISTRY_ID }}/anicontinue

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # нужен для Workload Identity Federation (опционально)
      contents: read

    steps:
      - uses: actions/checkout@v4

      # Авторизация в YC Container Registry через SA JSON-ключ
      - name: Логин в Container Registry
        uses: yc-actions/yc-cr-login@v3
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON }}

      # Сборка и публикация образа (два тега: sha + latest)
      - name: Сборка и пуш Docker-образа
        run: |
          docker build \
            -t $IMAGE:${{ github.sha }} \
            -t $IMAGE:latest \
            .
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      # Установка yc CLI для деплоя ревизии
      - name: Установить YC CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -a
          echo "${HOME}/yandex-cloud/bin" >> $GITHUB_PATH

      - name: Настроить YC CLI
        run: |
          printf '%s' '${{ secrets.YC_SA_JSON }}' > /tmp/sa-key.json
          yc config set service-account-key /tmp/sa-key.json
          yc config set folder-id ${{ secrets.YC_FOLDER_ID }}
          rm /tmp/sa-key.json   # удаляем после настройки

      # Деплой новой ревизии с секретами через --environment.
      # Секреты хранятся в GitHub Secrets и передаются только в env контейнера,
      # в логах они маскируются GitHub Actions автоматически.
      - name: Деплой ревизии
        run: |
          yc serverless container revision deploy \
            --container-id "${{ secrets.YC_CONTAINER_ID }}" \
            --image "$IMAGE:${{ github.sha }}" \
            --service-account-id "${{ secrets.YC_SA_RUNNER_ID }}" \
            --memory 1024MB \
            --cores 1 \
            --execution-timeout 90s \
            --concurrency 10 \
            --environment "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            --environment "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" \
            --environment "ANTHROPIC_BASE_URL=${{ secrets.ANTHROPIC_BASE_URL }}" \
            --environment "CRON_SECRET=${{ secrets.CRON_SECRET }}"
