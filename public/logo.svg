<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A1A2E"/>
      <stop offset="100%" stop-color="#0D0D1A"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8409A" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#E8409A" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="80" fill="url(#bg)"/>

  <!-- Glow circle behind sakura -->
  <circle cx="200" cy="165" r="90" fill="url(#glow)" filter="url(#blur)"/>

  <!-- Sakura petals -->
  <!-- Petal 1 - top -->
  <ellipse cx="200" cy="110" rx="22" ry="38" fill="#E8409A" opacity="0.95" transform="rotate(0 200 165)"/>
  <!-- Petal 2 - top right -->
  <ellipse cx="200" cy="110" rx="22" ry="38" fill="#E8409A" opacity="0.9" transform="rotate(72 200 165)"/>
  <!-- Petal 3 - right -->
  <ellipse cx="200" cy="110" rx="22" ry="38" fill="#E8409A" opacity="0.9" transform="rotate(144 200 165)"/>
  <!-- Petal 4 - left -->
  <ellipse cx="200" cy="110" rx="22" ry="38" fill="#E8409A" opacity="0.9" transform="rotate(216 200 165)"/>
  <!-- Petal 5 - top left -->
  <ellipse cx="200" cy="110" rx="22" ry="38" fill="#E8409A" opacity="0.9" transform="rotate(288 200 165)"/>

  <!-- Petal inner highlight -->
  <ellipse cx="200" cy="118" rx="10" ry="20" fill="#ff6eb4" opacity="0.5" transform="rotate(0 200 165)"/>
  <ellipse cx="200" cy="118" rx="10" ry="20" fill="#ff6eb4" opacity="0.4" transform="rotate(72 200 165)"/>
  <ellipse cx="200" cy="118" rx="10" ry="20" fill="#ff6eb4" opacity="0.4" transform="rotate(144 200 165)"/>
  <ellipse cx="200" cy="118" rx="10" ry="20" fill="#ff6eb4" opacity="0.4" transform="rotate(216 200 165)"/>
  <ellipse cx="200" cy="118" rx="10" ry="20" fill="#ff6eb4" opacity="0.4" transform="rotate(288 200 165)"/>

  <!-- Center circle -->
  <circle cx="200" cy="165" r="18" fill="#FFD700" opacity="0.95"/>
  <circle cx="200" cy="165" r="10" fill="#FFA500"/>
  <!-- Center dots -->
  <circle cx="200" cy="155" r="2.5" fill="#fff" opacity="0.9"/>
  <circle cx="209" cy="170" r="2.5" fill="#fff" opacity="0.9"/>
  <circle cx="191" cy="170" r="2.5" fill="#fff" opacity="0.9"/>

  <!-- Border ring -->
  <circle cx="200" cy="165" r="18" fill="none" stroke="#ff6eb4" stroke-width="1.5" opacity="0.6"/>

  <!-- Text: AniContinue -->
  <text
    x="200"
    y="268"
    font-family="'Segoe UI', Arial, sans-serif"
    font-size="38"
    font-weight="800"
    fill="#FFFFFF"
    text-anchor="middle"
    letter-spacing="-1"
  >AniContinue</text>

  <!-- Tagline -->
  <text
    x="200"
    y="300"
    font-family="'Segoe UI', Arial, sans-serif"
    font-size="14"
    font-weight="400"
    fill="#E8409A"
    text-anchor="middle"
    letter-spacing="3"
    opacity="0.9"
  >FANFIC · AI · ANIME</text>

  <!-- Subtle bottom line decoration -->
  <line x1="120" y1="316" x2="280" y2="316" stroke="#E8409A" stroke-width="1" opacity="0.3"/>
</svg>
