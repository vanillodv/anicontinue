<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow1" cx="85%" cy="0%" r="55%">
      <stop offset="0%" stop-color="#E85D4F" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0D0B0A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#DFB55E" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0D0B0A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#0D0B0A"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Огромный кандзи на фоне -->
  <text x="600" y="460" text-anchor="middle" font-family="Noto Serif JP, serif" font-weight="900"
        font-size="520" fill="#F2EBD9" fill-opacity="0.05" letter-spacing="-8">続</text>

  <!-- Печать 続作 -->
  <g transform="translate(1030, 80) rotate(12)">
    <circle r="65" fill="#E85D4F"/>
    <circle r="58" fill="none" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="2"/>
    <text y="-6" text-anchor="middle" font-family="Noto Serif JP, serif" font-weight="900"
          font-size="36" fill="#FFFFFF" letter-spacing="2">続</text>
    <text y="36" text-anchor="middle" font-family="Noto Serif JP, serif" font-weight="900"
          font-size="36" fill="#FFFFFF" letter-spacing="2">作</text>
  </g>

  <!-- Eyebrow -->
  <circle cx="92" cy="238" r="5" fill="#E85D4F"/>
  <text x="110" y="244" font-family="ui-monospace, JetBrains Mono, monospace"
        font-size="14" fill="#8C8378" letter-spacing="3" font-weight="500">
    ФАНФИКИ НОВОГО ПОКОЛЕНИЯ · 続き物語
  </text>

  <!-- Title -->
  <text x="92" y="340" font-family="Playfair Display, Georgia, serif"
        font-weight="400" font-style="italic" font-size="92" fill="#F2EBD9" letter-spacing="-3">
    Продолжи
  </text>
  <text x="92" y="438" font-family="Playfair Display, Georgia, serif"
        font-weight="900" font-style="normal" font-size="92" fill="#F2EBD9" letter-spacing="-3">
    своё <tspan fill="#E85D4F">любимое</tspan> аниме.
  </text>

  <!-- Subtext -->
  <text x="92" y="500" font-family="ui-sans-serif, Manrope, sans-serif"
        font-size="22" fill="#F2EBD9" fill-opacity="0.7">
    Платформа, где AI становится вашим со-автором.
  </text>

  <!-- Brand footer -->
  <rect x="92" y="545" width="12" height="12" fill="#E85D4F" transform="translate(92,545) rotate(-4, 6, 6)"/>
  <text x="114" y="557" font-family="Playfair Display, Georgia, serif"
        font-weight="900" font-size="20" fill="#F2EBD9" letter-spacing="1">
    AniContinue · anicontinue.ru
  </text>
</svg>
